<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body{
                font-family: Arial, Helvetica, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #f2f2f2;
            }

            .calculator {
                width: 320px;
                background-color: #222;
                padding: 20px;
                border-radius: 15px;
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            }

            .display {
                width: 100%;
                height: 70px;
                background-color: #333;
                color: #fff;
                border: none;
                font-size: 32px;
                text-align: right;
                padding: 10px;
                border-radius: 10px;
                margin-bottom: 20px;
            }

            .buttons {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }

            button {
                width: 100%;
                height: 60px;
                font-size: 24px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }

            button:hover {
                background-color: #555;
            }

            .operator {
                background-color: #ff9500;
                color: #fff;
            }

            .operator:hover{
                background-color: #e08900;
            }

            .clear{
                background-color: #d9534f;
                color: #fff;
            }

            .equal{
                background-color: #28a745;
                color: #fff;
            }

            .zero{
                grid-column: span 2;
            }

        </style>
    </head>

   <body>
        <div class="calculator"> <div class="display">0</div> <div class="buttons"> <button class="clear">C</button> <button>⌫</button> <button class="operator">%</button> <button class="operator">÷</button> <button>7</button> <button>8</button> <button>9</button> <button class="operator">×</button> <button>4</button> <button>5</button> <button>6</button> <button class="operator">−</button> <button>1</button> <button>2</button> <button>3</button> <button class="operator">+</button> <button class="zero">0</button> <button>.</button> <button class="equal">=</button> </div> </div> </body>
   </body>

</html>
